# Claude Code binding profile "claude" (shipping stub).
# Roles name a capability in agents/<id>/agent.yaml; this file binds each
# capability to a concrete Claude model. Overwrite via onboard-models
# (profiles/personal.yaml + CLAUDE_PROFILE=personal), not by editing roles.
# Multi-vendor is fine in personal profiles; Stitch-strict delivery stays on
# profiles/codex.yaml (no Anthropic there).
profile: claude
harness: claude
description: "Claude Code skills. Strict: an unmapped capability fails closed. Models from the live Claude catalog on this machine."
strict: true

# Root session defaults (Claude Code --model / settings). Optional for skills-only export.
main:
  model: claude-fable-5-1
  reasoning: high

capabilities:
  orchestrator:
    model: claude-fable-5-1
    reasoning: high
  adversarial_audit:
    model: claude-fable-5-1
    reasoning: high
  taste:
    model: claude-fable-5-1
    reasoning: high
  verify:
    model: claude-fable-5-1
    reasoning: high
  implement:
    model: claude-opus-5-5
    reasoning: medium
  fast_narrow:
    model: claude-haiku-4-5-20251001
    reasoning: low

roles: {}
