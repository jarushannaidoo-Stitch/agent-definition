name: feature-graph
description: "Deliver one tiny frozen slice through an engineering-team DAG: a senior systems architect plans disjoint work packages and contracts, senior engineers build them with TDD in their own worktrees, a git role owns every Git operation and merges into one integration worktree, a parallel spec-only gate (lint, tests, verification, spec audit, Styla, Arc) then CSA judge the result, and one stacked draft PR lands CI green before cleanup. Runs detached with a status file per DAG. Use when the user selects feature graph, feature-graph, feeature graph, or the dag alias (for example, impl with dag)."
