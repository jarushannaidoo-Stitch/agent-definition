name: grokbot
display_name: "Grok Bot"
builtin: true
skills:
  out_env: GROKBOT_SKILLS_OUT
  out_default: agents/grokbot-skills
  shape: skill_md
agents:
  export: false
profile:
  shipping: grokbot
  env: GROKBOT_PROFILE
model_discovery:
  - kind: inherit
  # Grok Bot cloud-agent models (verified catalog, source: Grok Bot cloud-agent
  # models). Engineers, integrator, git and reviewers run as cloud agents on
  # these; the persistent architect bot inherits Grok Bot's model unless it is
  # launched as a cloud agent, then it uses the orchestrator binding.
  # reasoning_param keeps each model's own parameter name (effort or reasoning);
  # service tier "fast" means fast=true, omitted means fast=false.
  - kind: static
    source: "Grok Bot cloud-agent models"
    models:
      - id: claude-opus-5-5
        name: "Claude Opus 5.5 (Grok Bot cloud agent)"
        efforts: [low, medium, high, xhigh, max]
        service_tiers: [fast]
        reasoning_param: effort
      - id: grok-4.6
        name: "Grok 4.6 (Grok Bot cloud agent)"
        efforts: [low, medium, high, xhigh]
        service_tiers: [fast]
        reasoning_param: effort
      - id: gpt-5.6-sol
        name: "GPT-5.6 Sol (Grok Bot cloud agent)"
        efforts: [none, low, medium, high, xhigh, max]
        service_tiers: [fast]
        reasoning_param: reasoning
